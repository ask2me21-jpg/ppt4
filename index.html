<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#070a16;
  --text:#e9edf9;
  --muted:#8b94b3;
  --stroke:rgba(255,255,255,.09);
}
body{
  margin:0;min-height:100vh;
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color:var(--text);-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(1000px 700px at 8% -10%, rgba(124,92,255,.18), transparent 60%),
    radial-gradient(900px 650px at 100% -6%, rgba(34,211,238,.12), transparent 55%),
    var(--bg);
}
.wrap{max-width:1240px;margin:0 auto;padding:36px 18px 70px}

/* ---------- HEADER ---------- */
.head{text-align:center;margin-bottom:44px}
.head-icon{
  width:74px;height:74px;margin:0 auto 16px;border-radius:22px;
  display:grid;place-items:center;font-size:38px;line-height:1;
  background:linear-gradient(135deg, rgba(139,92,246,.3), rgba(34,211,238,.18));
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 22px 50px -20px rgba(139,92,246,.85), inset 0 1px 0 rgba(255,255,255,.18);
}
.head h1{
  margin:0;font-size:clamp(26px,4.6vw,40px);font-weight:900;letter-spacing:-.035em;line-height:1.12;
  background:linear-gradient(180deg,#fff,#a9b4d2);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.head p{margin:11px 0 0;font-size:14px;color:var(--muted);line-height:1.6}
.head p b{color:#c4b5fd;font-weight:700}

/* ---------- SECTION ---------- */
.section{margin-top:40px}
.section:first-of-type{margin-top:0}
.sec-head{display:flex;align-items:center;gap:12px;margin-bottom:18px;padding-left:2px}
.sec-tag{
  display:inline-flex;align-items:center;gap:8px;
  font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
  padding:8px 14px 8px 10px;border-radius:10px;border:1px solid;
}
.sec-tag .se{font-size:16px;line-height:1;letter-spacing:0}
.t1{color:#fbbf24;background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.32)}
.t2{color:#34d399;background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.32)}
.t3{color:#22d3ee;background:rgba(34,211,238,.1);border-color:rgba(34,211,238,.32)}
.t4{color:#fb7185;background:rgba(251,113,133,.1);border-color:rgba(251,113,133,.32)}
.sec-line{flex:1;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.14),transparent)}

/* ---------- GRID ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:14px}

/* ---------- CARD ---------- */
.card{
  padding:16px 16px 17px;border-radius:20px;
  background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.018));
  border:1px solid var(--stroke);
  box-shadow:0 18px 40px -32px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.06);
  transition:border-color .22s, transform .22s, box-shadow .22s;
}
.card:hover{
  transform:translateY(-3px);
  border-color:rgba(139,92,246,.42);
  box-shadow:0 26px 50px -28px rgba(139,92,246,.7), inset 0 1px 0 rgba(255,255,255,.08);
}

.card-top{display:flex;align-items:flex-start;gap:14px}

.icon-wrap{
  flex:0 0 auto;width:66px;height:66px;border-radius:20px;
  display:grid;place-items:center;
  font-size:34px;line-height:1;
  transition:transform .28s cubic-bezier(.34,1.56,.64,1);
}
.card:hover .icon-wrap{transform:scale(1.08) rotate(-5deg)}
.s1 .icon-wrap{background:radial-gradient(circle at 30% 22%, rgba(251,191,36,.42), rgba(251,191,36,.08));border:1px solid rgba(251,191,36,.35);box-shadow:0 10px 26px -14px rgba(251,191,36,.7)}
.s2 .icon-wrap{background:radial-gradient(circle at 30% 22%, rgba(52,211,153,.42), rgba(52,211,153,.08));border:1px solid rgba(52,211,153,.35);box-shadow:0 10px 26px -14px rgba(52,211,153,.7)}

.s4 .icon-wrap{background:radial-gradient(circle at 30% 22%, rgba(251,113,133,.42), rgba(251,113,133,.08));border:1px solid rgba(251,113,133,.35);box-shadow:0 10px 26px -14px rgba(251,113,133,.7)}

.meta{min-width:0;display:flex;flex-direction:column;gap:6px;flex:1}
.num{
  align-self:flex-start;
  padding:3px 9px;border-radius:7px;
  font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:800;letter-spacing:.06em;

.s1 .num{color:#fbbf24;background:rgba(251,191,36,.14)}
.s2 .num{color:#34d399;background:rgba(52,211,153,.14)}
.s3 .num{color:#22d3ee;background:rgba(34,211,238,.14)}
.s4 .num{color:#fb7185;background:rgba(251,113,133,.14)}

.title{
  margin:0;font-size:14.5px;font-weight:800;line-height:1.32;
  letter-spacing:-.012em;color:#eaeffb;
}

/* ---------- MARATHI EXPLANATION ---------- */
.marathi{
  margin:2px 0 0;
  font-family:'Noto Sans Devanagari','Inter',system-ui,sans-serif;
  font-size:12.5px;font-weight:500;line-height:1.6;
  color:#9aa7c9;
}

/* ---------- WORD BOXES (English + Marathi) ---------- */
.words{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}
.w{
  display:inline-flex;align-items:center;gap:8px;
  padding:7px 11px 7px 7px;border-radius:11px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);
  transition:border-color .2s, background .2s;
}
.w:hover{border-color:rgba(139,92,246,.4);background:rgba(139,92,246,.08)}
.w i{
  font-style:normal;display:grid;place-items:center;flex:0 0 auto;
  width:19px;height:19px;border-radius:6px;
  font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:800;
  color:#a78bfa;background:rgba(139,92,246,.2);
}
.w .txt{display:flex;flex-direction:column;line-height:1.28}
.w .en{font-size:12.5px;font-weight:700;color:#dbe2f3}
.w .mr{
  font-family:'Noto Sans Devanagari','Inter',system-ui,sans-serif;
  font-size:10.5px;font-weight:500;color:#8b96b8;margin-top:1px;

/* ---------- FOOTER ---------- */
.foot{margin-top:46px;text-align:center;font-size:12.5px;color:var(--muted);line-height:1.9}
.foot b{color:#c4b5fd;font-weight:700}

/* ---------- MOBILE ---------- */
@media(max-width:640px){
  .wrap{padding:26px 13px 56px}
  .grid{grid-template-columns:1fr;gap:11px}
  .card{padding:14px}
  .icon-wrap{width:56px;height:56px;font-size:29px;border-radius:17px}
  .title{font-size:13.5px}
  .marathi{font-size:12px}
  .w{padding:6px 10px 6px 6px}
  .w .en{font-size:12px}
  .w .mr{font-size:10px}
  .head-icon{width:64px;height:64px;font-size:32px;border-radius:20px}

/* ---------- PRINT ---------- */
@media print{
  body{background:#fff;color:#111}
  .head h1{color:#111;-webkit-text-fill-color:#111}
  .head p,.foot{color:#555}
  .card{background:#fff;border:1px solid #ddd;box-shadow:none;break-inside:avoid}

  .w .mr{color:#555}
  .w i{background:#e8e8ef;color:#555}
  .sec-line{background:#ddd}
  .icon-wrap{box-shadow:none}
}

/* =========================================================
   RENDER
   ========================================================= */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');

function cardHTML(t) {
  const set = SETS.find(s => s.key === t.set);

  const words = t.seq.map((pair, i) => {
    const [en, mr] = pair;
    return `<span class="w">
      <i>${i + 1}</i>
      <span class="txt">
        <span class="en">${esc(en)}</span>
        <span class="mr">${esc(mr)}</span>
      </span>
    </span>`;
  }).join('');

  return `
    <article class="card ${set.scls}">
      <div class="card-top">
        <div class="icon-wrap" aria-hidden="true">${t.icon}</div>
        <div class="meta">
          <span class="num">TOPIC ${pad(t.id)}</span>
          <h2 class="title">${esc(t.topic)}</h2>
          <p class="marathi">${esc(t.marathi)}</p>
        </div>
      </div>
      <div class="words">${words}</div>
    </article>`;
}

function render() {
  const out = document.getElementById('out');

  out.innerHTML = SETS.map(set => {
    const list = TOPICS.filter(t => t.set === set.key);
    return `
      <section class="section">
        <div class="sec-head">
          <span class="sec-tag ${set.tag}"><span class="se">${set.icon}</span>${set.name}</span>
          <span class="sec-line"></span>
        </div>
        <div class="grid">${list.map(cardHTML).join('')}</div>
      </section>`;
  }).join('');
}

render();
</script>
